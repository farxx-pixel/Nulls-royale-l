name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Show repo tree (debug)
        run: |
          echo "===== repo root ====="
          ls -la
          echo "===== app/ ====="
          ls -la app || true
          echo "===== app/src/main/ ====="
          ls -la app/src/main || true
          echo "===== app/src/main/res/values/ ====="
          ls -la app/src/main/res/values || true
          echo "===== app/src/main/java/com/cinder/coach/ ====="
          find app/src/main/java -type f 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cinder-coach-debug
          path: app/build/outputs/apk/debug/app-debug.apk
